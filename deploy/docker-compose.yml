# Dark Tunnel on one small server: the app container plus Caddy, which gets HTTPS certificates for both names.
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      PORT: "8080"
      APP_ORIGIN: https://darktunnel.lol
      PROXY_ORIGIN: https://go.darktunnel.lol
      TRUST_PROXY: "1"
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
