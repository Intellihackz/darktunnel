# Dark Tunnel on Fly.io. Same Dockerfile as Railway.
# Change `app` to the name you picked, and PROXY_ORIGIN to match it.
app = "darktunnel"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  APP_ORIGIN = "https://darktunnel.lol"
  PROXY_ORIGIN = "https://darktunnel.fly.dev"
  TRUST_PROXY = "1"
  CLIENT_IP_HEADER = "fly-client-ip"

[http_service]
  internal_port = 8080
  force_https = true
  # one machine, always on: the limits live in memory and the relay holds websockets open
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 800

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
